name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.lock.txt
      - name: Install locked runtime
        run: python -m pip install -r backend/requirements-runtime.lock.txt
      - name: Repository and documentation
        run: python scripts/Check-Repository.py
      - name: JavaScript syntax
        run: |
          node --check page/assets/local-provider.js
          node --check page/assets/local-schedule.js
          node --check page/assets/points-history.js
          node --check page/assets/key-setup.js
      - name: Offline regression
        run: python -m unittest discover -s tests -p 'test_*.py' -q
